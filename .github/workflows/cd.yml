name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up SSH Key
        shell: bash
        run: |
          echo "${{ secrets.EC2_KEY }}" > ~/DjangoCDKey.pem
          chmod 600 ~/DjangoCDKey.pem

      - name: Install rsync
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Deploy Code
        shell: bash
        run: |
          echo "Deploying application to EC2..."

          rsync -avz \
            --delete \
            --exclude='.git/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='db.sqlite3' \
            -e "ssh -o StrictHostKeyChecking=no -i ~/DjangoCDKey.pem" \
            ./ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/Django_Project/"

          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/DjangoCDKey.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << EOF

          set -e

          cd /home/${{ secrets.EC2_USER }}/Django_Project

          echo "Fixing project ownership..."
          sudo chown -R ubuntu:ubuntu .

          echo "Stopping existing containers..."
          docker compose down

          echo "Building and starting containers..."
          docker compose up --build -d

          echo "Checking container status..."
          docker compose ps

          echo "Deployment completed successfully!"

          EOF